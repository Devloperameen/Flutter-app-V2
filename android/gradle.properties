org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true

# AGP 8.x: Use old DSL (since Flutter Gradle plugin not yet ready for AGP 9.x new DSL)
android.newDsl=false

# Disable built-in Kotlin for AGP 8.x (will use Kotlin Gradle Plugin)
android.builtInKotlin=false

# Compilation target
android.compileSdkVersion=36

# Gradle performance optimizations
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin optimizations
kotlin.incremental=true

# Java version (required for Gradle 8.x)
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Kotlin JVM target validation
kotlin.jvm.target.validation.mode=warning

# R8/ProGuard optimizations
android.enableJetifier=true
android.enableR8.fullMode=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
